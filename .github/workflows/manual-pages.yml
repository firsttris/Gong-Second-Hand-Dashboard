name: Manual Build And Deploy Dashboard

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh item data
        run: |
          python scripts/fetch_secondhand.py \
            --config config/preferences.json \
            --output web/public/data/items.json \
            --history data/history.json

      - name: Detect new items
        id: new_items
        run: |
          python scripts/detect_new_items.py \
            --items-json web/public/data/items.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Send email notification
        if: steps.new_items.outputs.has_new == 'true' && secrets.SMTP_SERVER != '' && secrets.SMTP_PORT != '' && secrets.SMTP_USERNAME != '' && secrets.SMTP_PASSWORD != '' && secrets.EMAIL_FROM != '' && secrets.EMAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: ${{ steps.new_items.outputs.new_items }} neue Gong Second-Hand Items
          to: ${{ secrets.EMAIL_TO }}
          from: ${{ secrets.EMAIL_FROM }}
          body: |
            Es wurden ${{ steps.new_items.outputs.new_items }} neue Gong Second-Hand Items gefunden.

            Dashboard:
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

            Diese Nachricht wurde automatisch durch den GitHub Actions Workflow versendet.

      - name: Warn when email secrets are missing
        if: steps.new_items.outputs.has_new == 'true' && (secrets.SMTP_SERVER == '' || secrets.SMTP_PORT == '' || secrets.SMTP_USERNAME == '' || secrets.SMTP_PASSWORD == '' || secrets.EMAIL_FROM == '' || secrets.EMAIL_TO == '')
        run: |
          echo "New items found (${{ steps.new_items.outputs.new_items }}), but email SMTP secrets are not fully configured."

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/items.json data/history.json
          git diff --cached --quiet || git commit -m "chore: refresh second hand data"
          git push || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
