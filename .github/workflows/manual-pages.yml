name: Manual Build And Deploy Dashboard

on:
  workflow_dispatch:
  schedule:
    # Runs daily at 06:00 UTC
    - cron: "0 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      SMTP_SERVER: ${{ vars.SMTP_SERVER }}
      SMTP_PORT: ${{ vars.SMTP_PORT }}
      SMTP_USERNAME: ${{ vars.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_FROM: ${{ vars.EMAIL_FROM }}
      EMAIL_TO: ${{ vars.EMAIL_TO }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Refresh item data
        run: |
          python scripts/fetch_secondhand.py \
            --config config/preferences.json \
            --output web/public/data/items.json \
            --history data/history.json

      - name: Detect new items
        id: new_items
        run: |
          python scripts/detect_new_items.py \
            --items-json web/public/data/items.json \
            --github-output "$GITHUB_OUTPUT"

      - name: Send email notification
        if: steps.new_items.outputs.has_new == 'true' && env.SMTP_SERVER != '' && env.SMTP_PORT != '' && env.SMTP_USERNAME != '' && env.SMTP_PASSWORD != '' && env.EMAIL_FROM != '' && env.EMAIL_TO != ''
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ env.SMTP_SERVER }}
          server_port: ${{ env.SMTP_PORT }}
          username: ${{ env.SMTP_USERNAME }}
          password: ${{ env.SMTP_PASSWORD }}
          subject: ${{ steps.new_items.outputs.new_items }} neue Gong Second-Hand Items
          to: ${{ env.EMAIL_TO }}
          from: ${{ env.EMAIL_FROM }}
          body: |
            Es wurden ${{ steps.new_items.outputs.new_items }} neue Gong Second-Hand Items gefunden.

            Dashboard:
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/

            Diese Nachricht wurde automatisch durch den GitHub Actions Workflow versendet.

      - name: Warn when email configuration is missing
        if: steps.new_items.outputs.has_new == 'true' && (env.SMTP_SERVER == '' || env.SMTP_PORT == '' || env.SMTP_USERNAME == '' || env.SMTP_PASSWORD == '' || env.EMAIL_FROM == '' || env.EMAIL_TO == '')
        run: |
          echo "New items found (${{ steps.new_items.outputs.new_items }}), but email SMTP configuration is incomplete (vars + secret)."

      - name: Send Telegram notification
        if: steps.new_items.outputs.has_new == 'true' && env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != ''
        run: |
          DASHBOARD_URL="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          MESSAGE="${{ steps.new_items.outputs.new_items }} neue Gong Second-Hand Items gefunden.%0A${DASHBOARD_URL}"
          curl -sS "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d text="${MESSAGE}" \
            -d disable_web_page_preview=true

      - name: Warn when Telegram configuration is missing
        if: steps.new_items.outputs.has_new == 'true' && (env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == '')
        run: |
          echo "New items found (${{ steps.new_items.outputs.new_items }}), but Telegram configuration is incomplete (vars + secret)."

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add web/public/data/items.json data/history.json
          git diff --cached --quiet || git commit -m "chore: refresh second hand data"
          git push || true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install
        working-directory: web

      - name: Build frontend
        run: npm run build
        working-directory: web

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
